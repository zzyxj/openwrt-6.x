name: ZN-M2 Build Competition

on:
  workflow_dispatch: # 允许手动点击按钮点火

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 部署高能编译环境
      uses: actions/checkout@v4

    - name: 2. 准备大内功（安装依赖）
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils

    - name: 3. 同步克隆你的相同源码
      run: |
        git clone --depth 1 -b main https://github.com/LiBwrt/openwrt-6.x openwrt

    - name: 4. 喂入一模一样的 .config
      run: |
        # 把刚才上传到根目录的 m2.config 复制并改名到 openwrt 目录下
        cp m2.config openwrt/.config
        cd openwrt
        # 让系统根据你的选项自动精简并补全依赖
        make defconfig

    - name: 5. 开启云端全速编译
      run: |
        cd openwrt
        make -j$(nproc) V=s
