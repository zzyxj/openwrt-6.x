name: Build OpenWrt for IPQ60XX/807X

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch: # 支持手动点击按钮触发编译

env:
  REPO_URL: https://github.com/zzyxj/openwrt-6.x  # 直接锁定上游源码，防止递归克隆
  REPO_BRANCH: main-nss
  CONFIG_FILE: .config
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 提前适配 GitHub 2026 年新版 Node.js 24 环境

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 检出你自己的仓库（用于获取里面的 .config 配置文件）
    - name: Checkout Custom Config
      uses: actions/checkout@v4

    # 2. 清理 Docker 缓存并设置时区
    - name: Clean Docker Cache & Set Timezone
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo docker image prune -a -f
        sudo timedatectl set-timezone "$TZ"

    - name: Update APT Packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update

    # 3. 安装完整依赖
    - name: Install Build Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto zlib1g-dev cgroup-tools zstd libzstd-dev lib32stdc++6 python3-pyelftools

    # 4. 克隆 OpenWrt 源码并配置 Git 全局信息
    - name: Clone source code
      run: |
        df -h
        git clone -b $REPO_BRANCH $REPO_URL openwrt_src
        cd openwrt_src
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    # 5. 解除 Git 安全目录限制
    - name: Fix Git Safe Directory
      run: |
        git config --global --add safe.directory /home/runner/work/openwrt-6.x/openwrt-6.x/openwrt_src
        git config --global --add safe.directory $GITHUB_WORKSPACE/openwrt_src

    # 6. 核心：把自定义的 .config 移动到源码目录中
    - name: Load custom configuration
      run: |
        if [ -f "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" openwrt_src/.config
          echo "Successfully loaded custom .config"
        else
          echo "No custom .config found, will use default"
        fi

    # 6.5【正确切入】执行针对高通 ZN_M2 / IPQ 平台的无线与加密组件剔除脚本
    - name: Apply IPQ60xx Custom Config Patches
      run: |
        cd openwrt_src
        echo "=== 开始执行无线与加密组件剔除脚本 ==="
        
        # 1. 彻底关闭无线加密和认证组件（解决 hostapd / wpad 编译报错）
        sed -i 's/CONFIG_DEFAULT_wpad-openssl=y/CONFIG_DEFAULT_wpad-openssl=n/' .config
        echo "CONFIG_PACKAGE_wpad-openssl=n" >> .config
        echo "CONFIG_PACKAGE_hostapd=n" >> .config

        # 2. 关闭高通 IPQ60xx 的无线驱动（kmod-ath11k 等）
        sed -i 's/CONFIG_DEFAULT_kmod-ath11k=y/CONFIG_DEFAULT_kmod-ath11k=n/' .config
        sed -i 's/CONFIG_DEFAULT_kmod-ath11k-ahb=y/CONFIG_DEFAULT_kmod-ath11k-ahb=n/' .config
        sed -i 's/CONFIG_DEFAULT_kmod-ath11k-pci=y/CONFIG_DEFAULT_kmod-ath11k-pci=n/' .config
        echo "CONFIG_PACKAGE_kmod-ath11k=n" >> .config
        echo "CONFIG_PACKAGE_kmod-ath11k-ahb=n" >> .config
        echo "CONFIG_PACKAGE_kmod-ath11k-pci=n" >> .config

        # 3. 关闭无线固件和 NSS 相关的无线加速（节省空间）
        sed -i 's/CONFIG_DEFAULT_ath11k-firmware-ipq6018=y/CONFIG_DEFAULT_ath11k-firmware-ipq6018=n/' .config
        sed -i 's/CONFIG_DEFAULT_ipq-wifi-zn_m2=y/CONFIG_DEFAULT_ipq-wifi-zn_m2=n/' .config
        sed -i 's/CONFIG_DEFAULT_kmod-qca-nss-drv-wifi-meshmgr=y/CONFIG_DEFAULT_kmod-qca-nss-drv-wifi-meshmgr=n/' .config
        echo "CONFIG_PACKAGE_ath11k-firmware-ipq6018=n" >> .config
        echo "CONFIG_PACKAGE_ipq-wifi-zn_m2=n" >> .config
        echo "CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=n" >> .config
        
        echo "=== 脚本修改完成 ==="

    # 7. 强力更新并安装 Feeds（带重试机制）
    - name: Update & Install feeds
      run: |
        cd openwrt_src
        rm -rf feeds feeds.conf.default.index
        
        echo "=== 开始拉取 Feeds 源码（带失败重试） ==="
        for i in {1..3}; do ./scripts/feeds update -a && break || sleep 5; done
        
        echo "=== 开始安装 Feeds 软件包 ==="
        ./scripts/feeds install -a

    # 8. 生成配置
    - name: Generate configuration
      id: defconfig
      run: |
        cd openwrt_src
        make defconfig

    # 9. 容错排查：如果环境检查不幸失败，强行拉取真正的标准错误输出
    - name: Inspect Prerequisite Failure Log
      if: failure() && steps.defconfig.outcome == 'failure'
      run: |
        echo "=================================================="
        echo "=== 警告：defconfig 失败！正在排查最后的死因... ==="
        echo "=================================================="
        if [ -f "openwrt_src/staging_dir/host/.prereq-build" ]; then
          cat openwrt_src/staging_dir/host/.prereq-build
        else
          echo "提示：错误依然发生在 feeds 验证或配置解析冲突阶段，未能生成环境日志。"
          echo "请向上滚动日志，仔细查看第 7 步和第 8 步的完整报错输出。"
        fi
        exit 1

    # 10. 针对高通 NSS 特调的 2 线程编译策略
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt_src
        echo "Using 2 threads to prevent OOM for Qualcomm NSS build..."
        make -j2 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -h
        free -m

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        if [ -d "openwrt_src/bin/targets" ]; then
          cd openwrt_src/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "Error: Target directory does not exist!"
          exit 1
        fi

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_ZN_M2_Firmware
        path: ${{ env.FIRMWARE_PATH }}/*
