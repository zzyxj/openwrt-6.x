name: ZN-M2 Turbo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 强制指定更稳定的 Ubuntu 22.04 环境，完美兼容老固件源码
    steps:
    - name: 1. 部署环境
      uses: actions/checkout@v4

    - name: 2. 极速注入编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file qemu-utils

    - name: 3. 秒级克隆源码
      run: |
        # 加上 --depth 1 和 --single-branch 砍掉所有历史提交历史，速度起飞
        git clone --depth 1 --single-branch -b main https://github.com/LiBwrt/openwrt-6.x openwrt

    - name: 4. 注入配置并极速精简
      run: |
        cp m2.config openwrt/.config
        cd openwrt
        make defconfig

    - name: 5. 轰满多线程-极限编译
      run: |
        cd openwrt
        # 强制拉满云端服务器的所有 CPU 核心和并发线程
        make -j$(nproc) V=s

    - name: 6. 榨出成品固件
      if: success()
      run: |
        mkdir -p firmware_bin
        find openwrt/bin/targets/ -type f -name "*zn*m2*" -o -name "*sysupgrade*" | xargs -I {} cp {} ./firmware_bin/
        echo "FIRMWARE_PATH=$PWD/firmware_bin" >> $GITHUB_ENV

    - name: 7. 秒传固件提供下载
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt_ZN_M2_Turbo_Firmware
        path: ${{ env.FIRMWARE_PATH }}
        compression-level: 1 # 降低压缩率，用体积换取上传速度
