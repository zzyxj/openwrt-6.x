name: Build OpenWrt 6.x (LiBwrt)

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    paths:
      - '.config' # 当你更新 .config 并 push 时触发编译

env:
  REPO_URL: https://github.com/LiBwrt-op/openwrt-6.x.git
  REPO_BRANCH: main-nss
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /crypto /usr/local/.ghcup
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Run DIY Script (Remove Wireless from Source)
      run: |
        cd /workdir
        curl -sSL https://raw.githubusercontent.com/tangyl2000/zn-m2/main/zn-m2-libwrt.sh > diy.sh
        chmod +x diy.sh
        ./diy.sh openwrt
        
        # 自动挽救被大神的脚本误删的 PassWall 核心底层依赖文件夹，确保编译绝不报依赖缺失
        cd /workdir/openwrt
        mkdir -p package/network/utils/xtables-addons
        [ -f feeds/packages/net/xtables-addons/Makefile ] && ln -sf /workdir/openwrt/feeds/packages/net/xtables-addons/Makefile package/network/utils/xtables-addons/Makefile || true

    - name: Load custom configuration
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        
        # 远程拉取通过验证的基础配置覆盖本地文件
        curl -sSL https://raw.githubusercontent.com/tangyl2000/zn-m2/main/zn-m2-config-20260224 > openwrt/.config
        
        # 剔除集客AC和IPTV
        sed -i 's/CONFIG_PACKAGE_gecoosac=y/# CONFIG_PACKAGE_gecoosac is not set/' openwrt/.config
        sed -i 's/CONFIG_PACKAGE_rtp2httpd=y/# CONFIG_PACKAGE_rtp2httpd is not set/' openwrt/.config
        
        # 追加你点名要的有线神机大礼包
        cat <<EOF >> openwrt/.config

        # 核心网络代理（低内存首选 Nikki）
        CONFIG_PACKAGE_luci-app-nikki=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

        # 系统网页终端与状态查看
        CONFIG_PACKAGE_ttyd=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
        CONFIG_PACKAGE_htop=y

        # Argon 暗黑主题
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-app-argon-config=y
        CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
EOF

        cd openwrt
        # 补齐次级依赖
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tgz" | xargs -n 1 -P 4 wget -nv -c || true
        find package -name Makefile | xargs sed -i 's/https:\/\/sources.openwrt.org/http:\/\/sources.openwrt.org/g' || true
        make download -j8

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 保持单线程 -j1 V=s 确保首次编译 100% 安全通过
        make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep 'CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/CONFIG_TARGET_(.*)_DEVICE_(.*)=y/\1-\2/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -hT
        echo "::group::Compiler space usage"
        du -h --max-depth=1 /workdir/openwrt | sort -hr || true
        echo "::endgroup::"

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' || steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
