name: Build OpenWrt for IPQ60XX/807X

on:
  repository_dispatch:
    types: [build]
  workflow_dispatch: # 支持手动点击按钮触发编译

env:
  REPO_URL: https://github.com/zzyxj/openwrt-6.x  # 直接锁定上游源码，防止递归克隆
  REPO_BRANCH: main-nss
  CONFIG_FILE: .config
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 提前适配 GitHub 2026 年新版 Node.js 24 环境

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. 检出你自己的仓库（用于获取里面的 .config 配置文件）
    - name: Checkout Custom Config
      uses: actions/checkout@v4

    # 2. 温和地清理 Docker 缓存，确保 88GB 可用空间绝对够用
    - name: Clean Docker Cache & Set Timezone
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo docker image prune -a -f
        sudo timedatectl set-timezone "$TZ"

    - name: Update APT Packages
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update

    # 3. 安装最完整的高通 NSS + 6.x 内核依赖包
    - name: Install Build Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto zlib1g-dev cgroup-tools zstd libzstd-dev lib32stdc++6

    # 4. 在当前独立目录下克隆 OpenWrt 源码，绝不和根目录发生嵌套冲突
    - name: Clone source code
      run: |
        df -h
        git clone -b $REPO_BRANCH $REPO_URL openwrt_src

    # 5. 核心：把自定义的 .config 移动到源码目录中
    - name: Load custom configuration
      run: |
        if [ -f "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" openwrt_src/.config
          echo "Successfully loaded custom .config"
        else
          echo "No custom .config found, will use default"
        fi

    - name: Update & Install feeds
      run: |
        cd openwrt_src
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 6. 生成配置（这里不再使用 FORCE=1，让我们看它能否清白通过）
    - name: Generate configuration
      run: |
        cd openwrt_src
        make defconfig

    # 7. 针对高通 NSS 特调的 2 线程编译策略，防止内存溢出
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt_src
        echo "Using 2 threads to prevent OOM for Qualcomm NSS build..."
        make -j2 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: |
        df -h
        free -m

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        if [ -d "openwrt_src/bin/targets" ]; then
          cd openwrt_src/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "Error: Target directory does not exist!"
          exit 1
        fi

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_ZN_M2_Firmware
        path: ${{ env.FIRMWARE_PATH }}/*
